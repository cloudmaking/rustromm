name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Keep CI output readable when a test panics.
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Don't cancel the other platforms when one fails — the whole point of
      # this matrix is to see which platforms are affected.
      fail-fast: false
      matrix:
        include:
          # `cores` is the buildbot path for this target, or empty when no cores
          # are published for it. Only Windows arm64 is empty — the buildbot has
          # windows/x86 and windows/x86_64 and nothing else, so an arm64 Windows
          # build has no core it can dlopen. See docs/libretro-spike.md.
          - { os: ubuntu-latest,    label: Linux x86_64,   cores: "linux/x86_64",     ext: so }
          - { os: ubuntu-24.04-arm, label: Linux arm64,    cores: "linux/aarch64",    ext: so }
          # macos-latest is Apple Silicon. There is deliberately no Intel macOS
          # entry: the macos-13 image is being retired and its runners no longer
          # get picked up, which left jobs queued indefinitely. The Intel binary
          # is still released, cross-compiled from this same runner.
          - { os: macos-latest,     label: macOS arm64,    cores: "apple/osx/arm64",  ext: dylib }
          - { os: windows-latest,   label: Windows x86_64, cores: "windows/x86_64",   ext: dll }
          - { os: windows-11-arm,   label: Windows arm64,  cores: "",                 ext: dll }

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      # egui needs X11/Wayland development headers to build on Linux.
      # The other platforms ship what's needed with the OS SDK.
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          # Third-party repos preinstalled on the runner image (azure-cli and
          # friends) intermittently return 403, which fails apt-get update and
          # takes the whole job with it. Everything we need comes from the
          # Ubuntu archives, so tolerate a partial refresh.
          sudo apt-get update || true
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev \
            libudev-dev libgtk-3-dev

      - name: Build
        run: cargo build --all-targets --verbose

      # The live tests self-skip when RUSTROMM_LIVE_* is unset, so this runs
      # the unit, API and headless UI suites — no RomM server needed.
      - name: Test
        run: cargo test --verbose

      # Everything above runs without a core. This step is the one that proves
      # embedded emulation actually works on this platform: it fetches a stock
      # core and drives it through load, run, video, audio, input and save
      # states. Gambatte accepts a zeroed 32 KB buffer as a cartridge, so no ROM
      # is downloaded or shipped.
      - name: Fetch a libretro core
        if: matrix.cores != ''
        shell: bash
        run: |
          set -euo pipefail
          url="https://buildbot.libretro.com/nightly/${{ matrix.cores }}/latest/gambatte_libretro.${{ matrix.ext }}.zip"
          mkdir -p .cores
          curl -fsSL --retry 3 -o .cores/core.zip "$url"
          # unzip is not on the Windows runners; Python is, everywhere.
          python3 -c "import zipfile,sys; zipfile.ZipFile('.cores/core.zip').extractall('.cores')"
          ls -l .cores

      - name: Test against a real core
        if: matrix.cores != ''
        shell: bash
        env:
          RUSTROMM_TEST_CORE: .cores/gambatte_libretro.${{ matrix.ext }}
        run: cargo test --test core_tests -- --nocapture

      # Said out loud rather than silently skipped, so nobody reads a green tick
      # as coverage this target does not have.
      - name: Note the uncovered target
        if: matrix.cores == ''
        run: echo "::warning::No libretro cores are published for this target, so embedded emulation is untested here. Windows on ARM should run the x86_64 build."

  # The single biggest unknown in the whole rewrite.
  #
  # The libretro buildbot publishes no arm64 Windows cores — windows/x86 and
  # windows/x86_64 and nothing else — and a native ARM64 process cannot
  # LoadLibrary an x64 DLL. The proposed answer is to ship the x86_64 build to
  # Windows on ARM and let Prism emulate it, which only works if an emulated x64
  # process can load an x64 core. Nobody has verified that.
  #
  # If this job fails, Windows on ARM has no path at all and the README must say
  # so. It is one job and it answers the question before anything is built on
  # the assumption.
  windows-arm-under-emulation:
    name: Windows on ARM runs the x86_64 build
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      # Deliberately the x64 toolchain on an ARM runner: this is exactly the
      # configuration a Windows-on-ARM user would download.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: win-arm-x64-emulated

      - name: Fetch the x86_64 core
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cores
          curl -fsSL --retry 3 -o .cores/core.zip \
            https://buildbot.libretro.com/nightly/windows/x86_64/latest/gambatte_libretro.dll.zip
          python3 -c "import zipfile; zipfile.ZipFile('.cores/core.zip').extractall('.cores')"

      - name: Load an x64 core from an x64 process, emulated
        shell: bash
        env:
          RUSTROMM_TEST_CORE: .cores/gambatte_libretro.dll
        run: cargo test --target x86_64-pc-windows-msvc --test core_tests -- --nocapture

  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux GUI dependencies
        run: |
          # Third-party repos preinstalled on the runner image (azure-cli and
          # friends) intermittently return 403, which fails apt-get update and
          # takes the whole job with it. Everything we need comes from the
          # Ubuntu archives, so tolerate a partial refresh.
          sudo apt-get update || true
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev \
            libudev-dev libgtk-3-dev

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
