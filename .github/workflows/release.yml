name: Release

# Builds binaries for all three desktop platforms. macOS binaries in particular
# can only be produced on a macOS runner, so this workflow is how the
# cross-platform claim is actually delivered.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every target is built on a runner of its own architecture, with one
        # exception: the Intel macOS binary is cross-compiled from the Apple
        # Silicon runner. The macos-13 image is being retired and its jobs sit
        # queued forever, which blocked the entire release. Apple's toolchain
        # ships both darwin targets, so cross-compiling is well supported here.
        include:
          - os: ubuntu-latest
            label: Linux (x86_64)
            target: x86_64-unknown-linux-gnu
            binary: rustromm
            archive: rustromm-linux-x86_64.tar.gz
          - os: ubuntu-24.04-arm
            label: Linux (arm64)
            target: aarch64-unknown-linux-gnu
            binary: rustromm
            archive: rustromm-linux-arm64.tar.gz
          - os: macos-latest
            label: macOS (Apple Silicon)
            target: aarch64-apple-darwin
            binary: rustromm
            archive: rustromm-macos-arm64.tar.gz
          - os: macos-latest
            label: macOS (Intel)
            target: x86_64-apple-darwin
            binary: rustromm
            archive: rustromm-macos-x86_64.tar.gz
          - os: windows-latest
            label: Windows (x86_64)
            target: x86_64-pc-windows-msvc
            binary: rustromm.exe
            archive: rustromm-windows-x86_64.zip
          - os: windows-11-arm
            label: Windows (arm64)
            target: aarch64-pc-windows-msvc
            binary: rustromm.exe
            archive: rustromm-windows-arm64.zip

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          # Third-party repos preinstalled on the runner image (azure-cli and
          # friends) intermittently return 403, which fails apt-get update and
          # takes the whole job with it. Everything we need comes from the
          # Ubuntu archives, so tolerate a partial refresh.
          sudo apt-get update || true
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev \
            libudev-dev

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.archive }} ${{ matrix.binary }}

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path target/${{ matrix.target }}/release/${{ matrix.binary }} `
            -DestinationPath ${{ matrix.archive }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            rustromm-*.tar.gz
            rustromm-*.zip
          generate_release_notes: true
          body: |
            Desktop client for RomM.

            **These binaries are unsigned, so your OS will block the first launch.**

            **macOS** — "Apple could not verify this is free of malware". Clear the
            download quarantine flag:
            ```sh
            tar -xzf rustromm-macos-arm64.tar.gz
            xattr -c rustromm && chmod +x rustromm && ./rustromm
            ```
            Right-click → Open does *not* work: Apple removed it in Sequoia, and
            these are bare executables rather than `.app` bundles. The GUI
            alternative is System Settings → Privacy & Security → Open Anyway.

            **Windows** — SmartScreen → More info → Run anyway.

            **Linux** — `chmod +x rustromm && ./rustromm`
