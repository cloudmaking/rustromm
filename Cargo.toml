[package]
name = "rustromm"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "A cross-platform desktop client for RomM — browse your library, download games, launch them in your emulator."
repository = "https://github.com/cloudmaking/rustromm"
homepage = "https://github.com/cloudmaking/rustromm"
authors = ["Ali Raza <alicomputermaster@gmail.com>"]
keywords = ["romm", "retro", "emulation", "gui", "games"]
categories = ["games"]
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
eframe = { version = "0.35.0", features = ["persistence"] }
egui = "0.35.0"
egui_extras = { version = "0.35.0", features = ["all_loaders"] }
gilrs = { version = "0.11.2", optional = true }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
libloading = "0.8"
reqwest = { version = "0.13.4", features = ["blocking", "json", "query"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
urlencoding = "2.1.3"
zip = { version = "7.2.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
egui_kittest = "0.35.0"
httpmock = "0.8.3"
tempfile = "3.27.0"

[features]
default = ["gamepad"]
# gilrs pulls in native input libraries (libudev on Linux, XInput on Windows).
# Feature-gated so a platform where those don't build still ships a working
# app — you just lose controller navigation, not the whole binary.
gamepad = ["dep:gilrs"]

[build-dependencies]
cc = "1.4.0"
